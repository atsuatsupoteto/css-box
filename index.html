<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夜空の花火祭り</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #0c0c2e 0%, #1a1a3e 50%, #2d2d5f 100%);
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            animation: flash 2s ease-out infinite;
        }

        @keyframes flash {
            0%, 74%, 76%, 100% { background: linear-gradient(to bottom, #0c0c2e 0%, #1a1a3e 50%, #2d2d5f 100%); }
            75% { background: linear-gradient(to bottom, #2a2a4e 0%, #3a3a6e 50%, #4d4d8f 100%); }
        }

        .title {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 2.5rem;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            z-index: 10;
        }

        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: launch 6s ease-out infinite;
        }

        .firework::before {
            content: '';
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            top: -2px;
            left: -2px;
            opacity: 0;
            animation: explode 6s ease-out infinite;
            animation-delay: 0s;
        }

        .firework1 {
            left: 20%;
            background: #ff6b6b;
            animation-delay: 0s;
        }

        .firework1::before {
            background: radial-gradient(circle, #ff6b6b 0%, #ff4757 50%, #ff3742 100%);
            box-shadow: 
                0 0 15px #ff6b6b, 0 0 25px #ff6b6b, 0 0 35px #ff6b6b,
                20px 0px 0 #ff6b6b, -20px 0px 0 #ff4757, 0px 20px 0 #ff3742, 0px -20px 0 #ff6b6b,
                14px 14px 0 #ff6b6b, -14px -14px 0 #ff4757, 14px -14px 0 #ff3742, -14px 14px 0 #ff6b6b,
                30px 10px 0 #ff6b6b, -30px -10px 0 #ff4757, 10px 30px 0 #ff3742, -10px -30px 0 #ff6b6b,
                25px -15px 0 #ff6b6b, -25px 15px 0 #ff4757, 15px -25px 0 #ff3742, -15px 25px 0 #ff6b6b,
                35px 5px 0 #ff8a8a, -35px -5px 0 #ff2727, 5px 35px 0 #ff1212, -5px -35px 0 #ff9b9b,
                40px 0px 0 #ffaaaa, -40px 0px 0 #ff0707, 0px 40px 0 #ff0000, 0px -40px 0 #ffbbbb,
                28px 28px 0 #ff7b7b, -28px -28px 0 #ff3737, 28px -28px 0 #ff2222, -28px 28px 0 #ff8b8b;
            animation: explode 6s ease-out infinite, sparkle 0.5s ease-in-out infinite alternate;
            animation-delay: 0s, 3s;
        }

        .firework2 {
            left: 50%;
            background: #4ecdc4;
            animation-delay: 0.7s;
        }

        .firework2::before {
            background: radial-gradient(circle, #4ecdc4 0%, #26d0ce 50%, #1dd1a1 100%);
            box-shadow: 
                0 0 15px #4ecdc4, 0 0 25px #4ecdc4, 0 0 35px #4ecdc4,
                20px 0px 0 #4ecdc4, -20px 0px 0 #26d0ce, 0px 20px 0 #1dd1a1, 0px -20px 0 #4ecdc4,
                14px 14px 0 #4ecdc4, -14px -14px 0 #26d0ce, 14px -14px 0 #1dd1a1, -14px 14px 0 #4ecdc4,
                30px 10px 0 #4ecdc4, -30px -10px 0 #26d0ce, 10px 30px 0 #1dd1a1, -10px -30px 0 #4ecdc4,
                25px -15px 0 #4ecdc4, -25px 15px 0 #26d0ce, 15px -25px 0 #1dd1a1, -15px 25px 0 #4ecdc4,
                35px 5px 0 #6eeee4, -35px -5px 0 #06b0ae, 5px 35px 0 #00a181, -5px -35px 0 #7efff4,
                40px 0px 0 #8efff4, -40px 0px 0 #00908e, 0px 40px 0 #009171, 0px -40px 0 #9efff4,
                28px 28px 0 #5eddd4, -28px -28px 0 #16c0be, 28px -28px 0 #0db191, -28px 28px 0 #6eddd4;
            animation: explode 6s ease-out infinite, sparkle 0.7s ease-in-out infinite alternate;
            animation-delay: 0s, 3s;
        }

        .firework3 {
            left: 80%;
            background: #feca57;
            animation-delay: 1.4s;
        }

        .firework3::before {
            background: radial-gradient(circle, #feca57 0%, #ff9ff3 50%, #54a0ff 100%);
            box-shadow: 
                0 0 15px #feca57, 0 0 25px #feca57, 0 0 35px #feca57,
                20px 0px 0 #feca57, -20px 0px 0 #ff9ff3, 0px 20px 0 #54a0ff, 0px -20px 0 #feca57,
                14px 14px 0 #feca57, -14px -14px 0 #ff9ff3, 14px -14px 0 #54a0ff, -14px 14px 0 #feca57,
                30px 10px 0 #feca57, -30px -10px 0 #ff9ff3, 10px 30px 0 #54a0ff, -10px -30px 0 #feca57,
                25px -15px 0 #feca57, -25px 15px 0 #ff9ff3, 15px -25px 0 #54a0ff, -15px 25px 0 #feca57,
                35px 5px 0 #ffda77, -35px -5px 0 #ffbff3, 5px 35px 0 #74c0ff, -5px -35px 0 #ffea87,
                40px 0px 0 #ffea87, -40px 0px 0 #ffaff3, 0px 40px 0 #64b0ff, 0px -40px 0 #fffa97,
                28px 28px 0 #feda67, -28px -28px 0 #ffaff3, 28px -28px 0 #64b0ff, -28px 28px 0 #feda67;
            animation: explode 6s ease-out infinite, sparkle 0.6s ease-in-out infinite alternate;
            animation-delay: 0s, 3s;
        }

        @keyframes launch {
            0% {
                bottom: 0;
                opacity: 1;
            }
            50% {
                bottom: 65%;
                opacity: 1;
            }
            83% {
                bottom: 65%;
                opacity: 0;
            }
            100% {
                bottom: 0;
                opacity: 0;
            }
        }

        @keyframes launch-high {
            0% {
                bottom: 0;
                opacity: 1;
            }
            50% {
                bottom: 70%;
                opacity: 1;
            }
            83% {
                bottom: 70%;
                opacity: 0;
            }
            100% {
                bottom: 0;
                opacity: 0;
            }
        }

        @keyframes launch-low {
            0% {
                bottom: 0;
                opacity: 1;
            }
            50% {
                bottom: 55%;
                opacity: 1;
            }
            83% {
                bottom: 55%;
                opacity: 0;
            }
            100% {
                bottom: 0;
                opacity: 0;
            }
        }

        @keyframes launch-mid {
            0% {
                bottom: 0;
                opacity: 1;
            }
            50% {
                bottom: 60%;
                opacity: 1;
            }
            83% {
                bottom: 60%;
                opacity: 0;
            }
            100% {
                bottom: 0;
                opacity: 0;
            }
        }

        @keyframes explode {
            0%, 49% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(0);
                opacity: 0;
            }
            55% {
                transform: scale(0.8);
                opacity: 1;
            }
            70% {
                transform: scale(1.2);
                opacity: 0.9;
            }
            83% {
                transform: scale(1.5);
                opacity: 0;
            }
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        @keyframes sparkle {
            0% {
                filter: brightness(1) saturate(1);
            }
            100% {
                filter: brightness(1.5) saturate(1.3);
            }
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite alternate;
        }

        .star:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
        .star:nth-child(2) { top: 30%; left: 30%; animation-delay: 1s; }
        .star:nth-child(3) { top: 15%; left: 60%; animation-delay: 2s; }
        .star:nth-child(4) { top: 25%; left: 85%; animation-delay: 0.5s; }
        .star:nth-child(5) { top: 10%; left: 45%; animation-delay: 1.5s; }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <h1>一覧</h1>

    <div>
        <a href="/index.html">🎆夜空の花火祭り🎆</a>
    </div>

</body>
</html>
